<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Post Office</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="wavy">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
        </filter>
    </svg>

    <main class="page">
        <h1 class="sign"><a href="{{ url_for('index') }}">The Post Office</a></h1>

        <form class="paper" method="post" action="{{ url_for('send') }}">
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <div class="row">
                <label for="to_email">To:</label>
                <input type="email" id="to_email" name="to_email" value="{{ values.to_email }}" placeholder="their@email.com" required>
            </div>

            <label class="block" for="message">Message:</label>
            <textarea id="message" name="message" rows="7" maxlength="{{ max_message }}" required>{{ values.message }}</textarea>

            <div class="row from">
                <label for="from_name">From:</label>
                <input type="text" id="from_name" name="from_name" value="{{ values.from_name }}" placeholder="Your name" maxlength="100" required>
            </div>

            <button type="submit">Send card</button>
        </form>
    </main>
</body>
</html>
